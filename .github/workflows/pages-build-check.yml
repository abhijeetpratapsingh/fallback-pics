name: Pages Build Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build website
        run: pnpm web:build

      - name: Serve built website and run SEO regression checks
        env:
          SEO_CHECK_BASE_URL: http://127.0.0.1:4321
          SEO_CHECK_PUBLIC_ORIGIN: https://fallback.pics
          SEO_CHECK_API_BASE_URL: https://fallback.pics
          SEO_RECHECK_BASE_URL: http://127.0.0.1:4321
          SEO_RECHECK_PUBLIC_ORIGIN: https://fallback.pics
        run: |
          pnpm --dir apps/web preview --host 127.0.0.1 --port 4321 > /tmp/fallback-pics-web-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/ > /dev/null; then
              pnpm web:seo:smoke
              pnpm web:seo:priority
              exit 0
            fi
            sleep 1
          done

          cat /tmp/fallback-pics-web-preview.log
          exit 1
