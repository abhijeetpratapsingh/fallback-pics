name = "fallback-pics"
main = "src/index.ts"
compatibility_date = "2024-08-01"
account_id = "04f1fbe6c8a63cd40173f5958866906d"
# Remove nodejs_compat for faster cold starts
# compatibility_flags = ["nodejs_compat"]

[build]
command = "npm install"

[dev]
port = 8787
local_protocol = "http"

# Custom domains (configured via dashboard)
# Production URL: https://fallback.pics/api/v1
# Fallback URL: https://fallback-pics.billing-04f.workers.dev

# Production custom domain configured in Cloudflare Dashboard:
# - https://fallback.pics/api/v1
#
# Routes configuration - configured via dashboard
# routes = [
#   { pattern = "https://fallback.pics/api/v1/*", zone_name = "fallback.pics" }
# ]

# Production variables for the deployed Worker named "fallback-pics".
[vars]
ALLOWED_ORIGIN = "https://fallback.pics"
NEW_RELIC_APP_NAME = "fallback-pics"
NEW_RELIC_ENABLED = "true"
GOOGLE_ANALYTICS_ENABLED = "true"
# Set GOOGLE_ANALYTICS_MEASUREMENT_ID and GOOGLE_ANALYTICS_API_SECRET as Cloudflare Worker secrets.
# Example:
#   wrangler secret put GOOGLE_ANALYTICS_MEASUREMENT_ID
#   wrangler secret put GOOGLE_ANALYTICS_API_SECRET
