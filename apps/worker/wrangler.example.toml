name = "fallback-pics-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Update with your Cloudflare account ID
account_id = "YOUR_ACCOUNT_ID"

# Workers configuration
workers_dev = true

# For custom domain deployment
# routes = [
#   { pattern = "your-domain.com/*", zone_name = "your-domain.com" }
# ]

# Production variables for the deployed Worker.
[vars]
ENVIRONMENT = "production"
GOOGLE_ANALYTICS_ENABLED = "false"

# routes = [
#   { pattern = "fallback.pics/*", zone_name = "fallback.pics" }
# ]

# Optional Google Analytics 4 Measurement Protocol support for direct Worker/API URL calls.
# Set these with wrangler secrets when enabling telemetry:
#   wrangler secret put GOOGLE_ANALYTICS_MEASUREMENT_ID
#   wrangler secret put GOOGLE_ANALYTICS_API_SECRET
#   wrangler secret put GOOGLE_ANALYTICS_CLIENT_ID_SALT

# Optional: KV namespace for caching
# [[kv_namespaces]]
# binding = "CACHE"
# id = "YOUR_KV_NAMESPACE_ID"

# Optional: Durable Objects for analytics
# [[durable_objects.bindings]]
# name = "ANALYTICS"
# class_name = "Analytics"

# Optional: R2 bucket for storing custom images
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "fallback-pics-images"
